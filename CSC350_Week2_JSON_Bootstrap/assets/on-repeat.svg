<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 720" role="img" aria-labelledby="title desc">
  <title id="title">On Repeat vinyl illustration</title>
  <desc id="desc">An original retro purple and orange music poster featuring a vinyl record and starbursts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b488e"/>
      <stop offset=".52" stop-color="#51366c"/>
      <stop offset="1" stop-color="#33233f"/>
    </linearGradient>
